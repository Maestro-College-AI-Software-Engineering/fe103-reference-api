services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These win over the same names in .env, inside the container only.
      APP_CONFIG: production
      DATABASE_URL: postgresql+psycopg://taskapi:taskapi@db:5432/taskapi
      PORT: "8000"
      SEED_DEMO_DATA: "1"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi
      POSTGRES_DB: taskapi
    volumes:
      - taskapi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d taskapi"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  taskapi-data:
